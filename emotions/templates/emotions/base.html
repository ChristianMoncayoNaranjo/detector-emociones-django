<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Detector de Emociones{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos modernos y oscuros para evitar el aspecto decolorido */
        body {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }
        .navbar {
            background-color: #1e293b !important;
            border-bottom: 1px solid #334155;
        }
        .card, .panel, .bg-light {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }
        .table {
            color: #f8fafc !important;
        }
    </style>
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'index' %}">😊 Detector de Emociones</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'index' %}">En vivo</a>
            <a class="nav-link" href="{% url 'subir' %}">Subir imagen</a>
            <a class="nav-link" href="{% url 'historial' %}">Historial</a>
        </div>
    </div>
</nav>
<div class="container pb-5">{% block content %}{% endblock %}</div>
</body>
</html>
